<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <meta name="description" content="Mellowpeak personal homepage.">
        <title>Mellowpeak</title>
        <link rel="stylesheet" href="main.css">
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.1.1/css/all.css" integrity="sha384-O8whS3fhG2OnA5Kas0Y9l3cfpmYjapjI0E4theH4iuMD+pLhbf6JI0jIMfYcK3yZ" crossorigin="anonymous">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="icon" type="image/png" href="img/favicon.png">
    </head>
    <body>
        <header>
            <div class="hero">github
                <div class="hero-vehicle">
                    <img src="img/4runner-icon.png" alt="4Runner expedition vehicle">
                </div>
                <div class="hero-shadow"></div>
            </div>
        </header>
        <main>
            <section class="content-column">
                <h2>Everyday</h2>
                <ul>
                    <li><a href="https://mail.google.com/"><i class="fas fa-envelope" aria-hidden="true"></i>Gmail</a></li>
                    <li><a href="https://photos.google.com/"><i class="fas fa-images" aria-hidden="true"></i>Google Photos</a></li>
                    <li><a href="https://maps.google.com/"><i class="fas fa-map-marker-alt" aria-hidden="true"></i>Google Maps</a></li>
                    
                </ul>
            </section>
            <section class="content-column">
                <h2>Social</h2>
                <ul>
                    <li><a href="https://discord.com/app"><i class="fab fa-discord" aria-hidden="true"></i>Discord</a></li>
                    <li><a href="https://www.instagram.com/"><i class="fab fa-instagram" aria-hidden="true"></i>Instagram</a></li>
                    <li><a href="https://www.reddit.com/"><i class="fab fa-reddit-alien" aria-hidden="true"></i>Reddit</a></li>
                    <li><a href="https://www.facebook.com/"><i class="fab fa-facebook-f" aria-hidden="true"></i>Facebook</a></li>
                </ul>
            </section>
            <section class="content-column">
                <h2>Games & Media</h2>
                <ul>
                    <li><a href="https://www.youtube.com/"><i class="fab fa-youtube" aria-hidden="true"></i>YouTube</a></li>
                    <li><a href="https://na.finalfantasyxiv.com/lodestone/"><i class="fas fa-gamepad" aria-hidden="true"></i>FFXIV Lodestone</a></li>
                    <li><a href="https://maplestory.nexon.net/"><i class="fas fa-leaf" aria-hidden="true"></i>MapleStory Classic</a></li>
                    <li><a href="https://maplestory.nexon.net/"><i class="fas fa-coins" aria-hidden="true"></i>MesoWatch</a></li>
                    <li><a href="https://app.plex.tv/"><i class="fas fa-play-circle" aria-hidden="true"></i>Plex</a></li>
                </ul>
            </section>
        </main>
        <footer>
            <form action="http://www.google.com/search" method="get">
                <button type="submit"><i class="fa fa-search"></i></button>
                <input type="text" name="q" placeholder="Search..." autofocus autocomplete="off">
            </form>
        </footer>
    </body>
</html>
